<meta name="claude:viewport-fit-sides" content="cover">
<title>AMB OCPP 攻防指挥台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
/* layout: command-console — threat strip over [ map stage | telemetry rail ] over OCPP message terminal */
:root{
  --bg:#060a10; --stage:#0a1019; --panel:#101a27; --panel2:#0c131d; --line:#223040; --grid:#16202e;
  --fg:#dce7f3; --muted:#7f90a6;
  --idle:#39c2d8; --danger:#ff4d57; --warn:#ffb02e; --ok:#35d6a0; --accent:#4ea1ff; --csms:#c58bff;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:"Oxanium",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
  --body:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:
  radial-gradient(1100px 650px at 74% -12%,#0e1a2855,transparent 60%),
  radial-gradient(800px 560px at -5% 112%,#10212e4d,transparent 55%),var(--bg);
  color:var(--fg);font-family:var(--body);overflow:hidden}
.wrap{display:flex;flex-direction:column;height:100%;gap:9px;
  padding-left:max(13px,env(safe-area-inset-left,0px));padding-right:max(13px,env(safe-area-inset-right,0px));padding-block:11px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand h1{font-family:var(--disp);font-weight:700;font-size:clamp(14px,2.2vw,19px);letter-spacing:.04em;margin:0;white-space:nowrap}
.brand .sub{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--danger);
  text-transform:uppercase;letter-spacing:.12em;padding:3px 8px;border:1px solid #ff4d5740;border-radius:999px;background:#ff4d5712}
.live b{width:7px;height:7px;border-radius:50%;background:var(--danger);box-shadow:0 0 8px var(--danger);animation:bl 1.1s infinite}
@keyframes bl{50%{opacity:.25}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel2)}
.seg button{font-family:var(--mono);font-size:11px;color:var(--muted);background:none;border:0;padding:7px 11px;cursor:pointer}
.seg button[aria-pressed=true]{color:#06121a;background:var(--idle);font-weight:600}
.transport{display:flex;align-items:center;gap:9px;flex:1;min-width:230px}
.play{font-family:var(--mono);font-size:12px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;min-width:82px}
.play:hover{border-color:var(--idle)}
.clock{font-family:var(--mono);font-size:13px;color:var(--idle);min-width:112px;font-variant-numeric:tabular-nums}
.scrub{position:relative;flex:1;min-width:0}
input[type=range]{width:100%;accent-color:var(--idle);cursor:pointer}
.ticks{position:relative;height:15px;margin-top:2px;font-family:var(--mono);font-size:9px;color:var(--muted)}
.tick{position:absolute;transform:translateX(-50%);white-space:nowrap}
.tick::before{content:"";position:absolute;top:-6px;left:50%;width:1px;height:5px;background:var(--line)}
.tick.detect{color:var(--warn)}.tick.detect::before{background:var(--warn)}
.tick.rec{color:var(--ok)}.tick.rec::before{background:var(--ok)}
.tick.atk{color:var(--danger)}.tick.atk::before{background:var(--danger)}
.speed select{font-family:var(--mono);font-size:10px;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:3px 5px}
/* threat strip */
.threat{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 11px}
.threat .lab{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.threat .lv{display:flex;gap:4px;flex:1}
.threat .lv i{flex:1;height:8px;border-radius:2px;background:#1b2838;transition:background .25s}
.threat .name{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.05em;min-width:66px;text-align:right}
/* main */
.main{display:grid;grid-template-columns:1fr 300px;gap:9px;flex:1;min-height:0}
.stage{position:relative;background:linear-gradient(0deg,#091018,#0a111b);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.stage svg{display:block;width:100%;height:100%}
.muni{stroke:#1b2838;stroke-width:.6}
.bound{fill:none;stroke:#35506e;stroke-width:1.3;filter:drop-shadow(0 0 4px #35506e55)}
.reg{fill:#39506533}.reg.dc{fill:#55708f55}
.beam{stroke:var(--danger);stroke-width:1.1;opacity:.5;stroke-dasharray:4 6;filter:drop-shadow(0 0 3px #ff4d5755);animation:flow .7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.node{stroke:#060c13;stroke-width:1;cursor:pointer;transition:fill .2s}
.node.idle{fill:var(--idle)}.node.cmp{fill:var(--danger)}.node.rec{fill:var(--ok)}
.ring{fill:none;stroke:var(--warn);stroke-width:1.5}
.csms{fill:var(--csms);stroke:#1a0f2a;stroke-width:1.3;filter:drop-shadow(0 0 7px #c58bff88)}
.csms.hit{fill:var(--danger);filter:drop-shadow(0 0 10px #ff4d57aa)}
.sweep{fill:none;stroke:var(--warn);opacity:0}
.lbl{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.legend{position:absolute;left:11px;bottom:9px;display:flex;flex-direction:column;gap:4px;background:#0a111ad9;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:9.5px}
.legend .row{display:flex;align-items:center;gap:6px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%}
.rail{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 10px;position:relative;overflow:hidden}
.kpi .k{font-family:var(--mono);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.kpi .v{font-family:var(--disp);font-weight:700;font-size:21px;line-height:1.05;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .u{font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.kpi.danger .v{color:var(--danger)}.kpi.warn .v{color:var(--warn)}.kpi.ok .v{color:var(--ok)}.kpi.idle .v{color:var(--idle)}
.kpi .bar{position:absolute;left:0;bottom:0;height:3px;background:currentColor;opacity:.85;transition:width .2s}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 10px}
.card h3{font-family:var(--mono);font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px;display:flex;justify-content:space-between}
.card h3 .fire{color:var(--warn);opacity:0;transition:opacity .2s}
.card h3 .fire.on{opacity:1}
.tele{width:100%;height:52px;display:block}
.verdict{font-family:var(--mono);font-size:10.5px;color:var(--muted);line-height:1.5}
.verdict b{color:var(--fg)}
/* terminal */
.term{background:#070d14;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0}
.term .bar{display:flex;align-items:center;gap:8px;padding:6px 11px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10px;color:var(--muted)}
.term .bar .d{width:9px;height:9px;border-radius:50%;background:#2a3645}
.term .bar .t{color:var(--idle);text-transform:uppercase;letter-spacing:.1em}
.feed{font-family:var(--mono);font-size:11.5px;line-height:1.5;padding:6px 11px;overflow:auto;height:122px}
.feed .ln{display:flex;gap:9px;color:var(--muted);white-space:nowrap}
.feed .ln .ts{color:#5b6c82;min-width:60px;font-variant-numeric:tabular-nums}
.feed .ln.ok{color:#8fb0c9}.feed .ln.atk{color:var(--danger)}.feed .ln.alarm{color:var(--warn)}.feed .ln.contain{color:var(--ok)}
.tip{position:fixed;pointer-events:none;background:#0a1019;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:11px;color:var(--fg);z-index:30;max-width:240px;opacity:0;transition:opacity .1s}
.tip b{color:var(--idle)}.tip .s{color:var(--muted)}
.foot{font-family:var(--mono);font-size:9px;color:var(--muted);text-align:center}
@media (max-width:820px){
  .main{grid-template-columns:1fr;grid-template-rows:minmax(300px,1fr) auto}
  .rail{flex-direction:row;flex-wrap:wrap;overflow:visible}.kpis{flex:1;min-width:210px}.card{flex:1;min-width:190px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.beam{stroke-dasharray:none}}
</style>

<div class="wrap">
  <header>
    <div class="brand"><h1>AMB · OCPP 攻防指挥台</h1><span class="sub">真实 OCPP 1.6 仿真回放</span></div>
    <span class="live"><b></b>LIVE</span>
    <div class="seg" id="seg" role="group" aria-label="防御配置"></div>
    <div class="transport">
      <button class="play" id="play">▶ 播放</button>
      <span class="clock" id="clock">T+00.0</span>
      <div class="scrub"><input type="range" id="scrub" min="0" max="60" step="0.5" value="0" aria-label="时间轴"><div class="ticks" id="ticks"></div></div>
      <span class="speed">速度<select id="speed"><option value="6">1×</option><option value="12" selected>2×</option><option value="24">4×</option></select></span>
    </div>
  </header>

  <div class="threat">
    <span class="lab">威胁等级</span>
    <div class="lv" id="lv"><i></i><i></i><i></i><i></i><i></i></div>
    <span class="name" id="lvname">安全</span>
  </div>

  <div class="main">
    <div class="stage" id="stage">
      <svg id="map" aria-label="AMB 攻防地图"></svg>
      <div class="legend">
        <div class="row"><span class="dot" style="background:var(--idle)"></span>正常</div>
        <div class="row"><span class="dot" style="background:var(--danger)"></span>被控</div>
        <div class="row"><span class="dot" style="border:2px solid var(--warn);background:transparent"></span>告警</div>
        <div class="row"><span class="dot" style="background:var(--ok)"></span>已隔离/恢复</div>
        <div class="row"><span class="dot" style="background:var(--csms);border-radius:2px"></span>CSMS</div>
        <div class="row" style="margin-top:3px;color:#5b6c82">市镇底色∝受控功率</div>
      </div>
    </div>
    <div class="rail">
      <div class="kpis">
        <div class="kpi danger"><div class="k">受控功率</div><div class="v"><span id="kw">0.00</span><span class="u"> MW</span></div><div class="bar" id="kwbar" style="width:0"></div></div>
        <div class="kpi warn"><div class="k">受控站点</div><div class="v" id="sites">0<span class="u"> /57</span></div><div class="bar" id="sitebar" style="width:0"></div></div>
        <div class="kpi idle"><div class="k">检测时延 τ_d</div><div class="v" id="taud">—<span class="u"> min</span></div></div>
        <div class="kpi ok"><div class="k">遏制恢复</div><div class="v" id="rec">—<span class="u"> min</span></div></div>
      </div>
      <div class="card"><h3>检测器① 指令速率 <span class="fire" id="f1">● 触发</span></h3><svg class="tele" id="t1"></svg></div>
      <div class="card"><h3>检测器② 规模×节律一致性 <span class="fire" id="f2">● 触发</span></h3><svg class="tele" id="t2"></svg></div>
      <div class="card"><h3>本场景实测结局</h3><div class="verdict" id="verdict"></div></div>
    </div>
  </div>

  <div class="term">
    <div class="bar"><span class="d"></span><span class="d"></span><span class="d"></span><span class="t">OCPP 1.6 报文流 · CSMS</span><span id="feedstat" style="margin-left:auto"></span></div>
    <div class="feed" id="feed"></div>
  </div>
  <div class="foot" id="foot"></div>
</div>
<div class="tip" id="tip"></div>

<script>/*__DATA__*/</script>
<script>
const $=s=>document.querySelector(s);
const fc=a=>({type:"FeatureCollection",features:a.map(f=>({type:"Feature",geometry:f.geometry,properties:f.properties}))});
const G=DATA.geo,SIM=DATA.sim,CFGS=DATA.configs,MAXT=60,PEAK=DATA.meta.peak_mw||0.9;
let cfg=CFGS[1];
const svg=d3.select("#map"),tip=$("#tip");
let proj,path,W,H,siteSel,csmsXY,siteXY={},muniAgg=[];
const norm=s=>(s||"").toString().trim().toLowerCase();

function layout(){
  const r=$("#stage").getBoundingClientRect();W=r.width;H=r.height;svg.attr("viewBox",`0 0 ${W} ${H}`);
  proj=d3.geoIdentity().reflectY(true).fitExtent([[16,16],[W-16,H-16]],fc(G.muni));path=d3.geoPath(proj);draw();
}
function draw(){
  svg.selectAll("*").remove();
  // muni choropleth base
  svg.append("g").attr("id","muni").selectAll("path").data(fc(G.muni).features).join("path")
    .attr("class","muni").attr("d",path).attr("fill","#0e1823");
  svg.append("g").selectAll("path").data(fc(G.boundary).features).join("path").attr("class","bound").attr("d",path);
  svg.append("g").selectAll("circle").data(G.registry).join("circle")
    .attr("class",d=>"reg"+(d.properties.has_dc?" dc":"")).attr("r",d=>d.properties.has_dc?1.8:1.2)
    .attr("cx",d=>proj(d.geometry.coordinates)[0]).attr("cy",d=>proj(d.geometry.coordinates)[1]);
  siteXY={};G.sites.forEach(s=>siteXY[s.properties.site_id]=proj(s.geometry.coordinates));
  const xs=G.sites.map(s=>siteXY[s.properties.site_id][0]);
  csmsXY=[d3.quantile(xs.slice().sort(d3.ascending),.5),20];
  // muni aggregation for live choropleth
  muniAgg=fc(G.muni).features.map((f,i)=>{
    const nm=norm(f.properties.nommuni);
    const ss=G.sites.filter(s=>norm(s.properties.muni)===nm);
    return {i,tot:d3.sum(ss,s=>s.properties.pkw||0),ids:ss.map(s=>s.properties.site_id)};
  });
  svg.append("g").attr("id","beams");
  svg.append("circle").attr("class","sweep").attr("id","sweep").attr("cx",csmsXY[0]).attr("cy",csmsXY[1]);
  siteSel=svg.append("g").selectAll("g.n").data(G.sites).join("g").attr("class","n")
    .attr("transform",d=>`translate(${siteXY[d.properties.site_id]})`);
  siteSel.append("circle").attr("class","ring").attr("r",7).attr("opacity",0);
  siteSel.append("circle").attr("class","node idle").attr("r",d=>3+Math.sqrt(Math.max(0,d.properties.sess_day||0))*.85);
  siteSel.on("mousemove",(e,d)=>showTip(e,d)).on("mouseleave",()=>tip.style.opacity=0);
  const c=svg.append("g").attr("id","csmsg");
  c.append("circle").attr("class","csms").attr("r",8).attr("cx",csmsXY[0]).attr("cy",csmsXY[1]);
  c.append("text").attr("class","lbl").attr("x",csmsXY[0]+12).attr("y",csmsXY[1]+4).text("CSMS");
  render(+$("#scrub").value);
}
function showTip(e,d){
  const p=d.properties,st=stateOf(p.site_id,+$("#scrub").value),nm={idle:"正常",cmp:"被控",rec:"已隔离/恢复"}[st];
  tip.innerHTML=`<b>${p.site_id}</b> · ${p.muni}<br>${p.name}<br><span class="s">${p.cfg_label} · ${(p.pkw||0).toFixed(0)} kW · 日会话 ${(p.sess_day||0).toFixed(1)}</span><br>状态：${nm}`;
  tip.style.opacity=1;tip.style.left=Math.min(e.clientX+14,innerWidth-250)+"px";tip.style.top=(e.clientY+14)+"px";
}
function stateOf(id,t){const s=SIM[cfg],cs=s.curtail[id];if(cs==null||t<cs)return"idle";if(s.recovery!=null&&t>=s.recovery)return"rec";return"cmp";}
function interp(mins,arr,t){if(t<=mins[0])return arr[0];if(t>=mins[mins.length-1])return arr[arr.length-1];let i=d3.bisectLeft(mins,t);const a=mins[i-1],b=mins[i];return arr[i-1]+(arr[i]-arr[i-1])*(t-a)/(b-a);}
const red=d3.interpolateRgb("#0e1823","#8a1f27");
function tele(id,key,thr,inv){ // draw a telemetry mini-chart
  const s=SIM[cfg],el=d3.select(id);el.selectAll("*").remove();
  const w=$(id).clientWidth||260,h=52,m=5;const x=d3.scaleLinear().domain([0,MAXT]).range([m,w-m]);
  const vals=s[key],mn=s.mins.map(v=>Math.max(0,v));
  const y=d3.scaleLinear().domain([0,Math.max(thr*1.4,d3.max(vals)||1)]).range([h-m,m]);
  el.attr("viewBox",`0 0 ${w} ${h}`);
  // threshold band
  el.append("line").attr("x1",m).attr("x2",w-m).attr("y1",y(thr)).attr("y2",y(thr)).attr("stroke",inv?"#ffb02e66":"#ffb02e66").attr("stroke-dasharray","2 2");
  const line=d3.line().defined((d,i)=>s.mins[i]>=0).x((d,i)=>x(Math.max(0,s.mins[i]))).y(d=>y(d)).curve(d3.curveMonotoneX);
  el.append("path").attr("d",line(vals)).attr("fill","none").attr("stroke",inv?"var(--idle)":"var(--danger)").attr("stroke-width",1.6);
  el.append("line").attr("id",id.slice(1)+"cur").attr("y1",m).attr("y2",h-m).attr("stroke","var(--idle)").attr("stroke-width",1).attr("x1",x(0)).attr("x2",x(0));
  el.append("text").attr("x",w-m).attr("y",y(thr)-3).attr("text-anchor","end").attr("class","lbl").attr("font-size",8).text(inv?"阈值 0.5":"阈值 5/2min");
}
function telCursor(t){["t1","t2"].forEach(id=>{const c=document.getElementById(id+"cur");if(!c)return;const w=$("#"+id).clientWidth||260,m=5,x=m+(w-2*m)*t/MAXT;c.setAttribute("x1",x);c.setAttribute("x2",x);});}
function render(t){
  const s=SIM[cfg];
  siteSel.select(".node").attr("class",d=>"node "+stateOf(d.properties.site_id,t));
  siteSel.select(".ring").attr("opacity",d=>{const cs=s.curtail[d.properties.site_id];return(s.t_detect!=null&&cs!=null&&t>=Math.max(cs,s.t_detect)&&stateOf(d.properties.site_id,t)=="cmp")?.9:0;});
  // beams
  const beams=svg.select("#beams").selectAll("line").data(G.sites.filter(d=>stateOf(d.properties.site_id,t)=="cmp"),d=>d.properties.site_id);
  beams.join(en=>en.append("line").attr("class","beam").attr("x1",csmsXY[0]).attr("y1",csmsXY[1]).attr("x2",d=>siteXY[d.properties.site_id][0]).attr("y2",d=>siteXY[d.properties.site_id][1]),u=>u,ex=>ex.remove());
  const anyCmp=G.sites.some(d=>stateOf(d.properties.site_id,t)=="cmp");
  svg.select(".csms").classed("hit",anyCmp);
  // live muni choropleth
  svg.select("#muni").selectAll("path").attr("fill",(d,i)=>{
    const a=muniAgg[i];if(!a||a.tot<=0)return"#0e1823";
    const ctrl=d3.sum(a.ids,id=>stateOf(id,t)=="cmp"?(G.sites.find(s=>s.properties.site_id==id).properties.pkw||0):0);
    return red(Math.min(1,ctrl/Math.max(a.tot,1)));});
  // detection sweep (one-shot near t_detect)
  if(s.t_detect!=null){const sw=d3.select("#sweep");const dd=t-s.t_detect;
    if(dd>=0&&dd<1.2){sw.attr("opacity",.5-dd*.4).attr("r",10+dd*Math.max(W,H)*.5).attr("stroke-width",2);}else sw.attr("opacity",0);}
  // KPIs
  const kw=Math.max(0,interp(s.mins,s.ctrl_mw,t)),sites=Math.round(interp(s.mins,s.ctrl_sites,t));
  $("#kw").textContent=kw.toFixed(3);$("#kwbar").style.width=Math.min(100,kw/PEAK*100)+"%";
  $("#sites").innerHTML=sites+'<span class="u"> /'+DATA.meta.n_sites+'</span>';$("#sitebar").style.width=(sites/DATA.meta.n_sites*100)+"%";
  $("#taud").innerHTML=(s.t_detect!=null&&t>=s.t_detect?s.t_detect.toFixed(1):"—")+'<span class="u"> min</span>';
  $("#rec").innerHTML=(s.recovery!=null&&t>=s.recovery?s.recovery.toFixed(1):"—")+'<span class="u"> min</span>';
  $("#clock").textContent="T+"+t.toFixed(1).padStart(4,"0");
  // detector telemetry fire flags
  const cr=interp(s.mins,s.cmdrate,t),ra=interp(s.mins,s.ratio,t);
  $("#f1").classList.toggle("on",t>=0&&cr>=5);$("#f2").classList.toggle("on",t>=0&&ra<0.5);
  telCursor(t);
  // threat level
  threat(kw,t,s);
  // terminal
  renderFeed(t);
}
function threat(kw,t,s){
  const frac=kw/PEAK;let lv=0;
  if(s.recovery!=null&&t>=s.recovery)lv=0; else if(frac>=.75)lv=4;else if(frac>=.45)lv=3;else if(frac>=.2)lv=2;else if(frac>0.01)lv=1;
  const names=["安全","注意","警戒","严重","危急"],cols=["#35d6a0","#39c2d8","#ffb02e","#ff8a3d","#ff4d57"];
  document.querySelectorAll("#lv i").forEach((e,i)=>e.style.background=i<lv?cols[lv]:"#1b2838");
  const nmEl=$("#lvname");nmEl.textContent=names[lv];nmEl.style.color=cols[lv];
}
let lastFeedT=-999;
function renderFeed(t){
  const s=SIM[cfg],feed=$("#feed");
  const shown=s.stream.filter(e=>e.t<=t);
  if(shown.length===feed.childElementCount && t>=lastFeedT) { // just toggle, cheap: rebuild only if count changed
  }
  feed.innerHTML=shown.map(e=>`<div class="ln ${e.k}"><span class="ts">T${e.t>=0?"+":""}${e.t.toFixed(1)}</span><span>${e.x}</span></div>`).join("");
  feed.scrollTop=feed.scrollHeight;
  $("#feedstat").textContent=shown.length+" / "+s.stream.length+" 条";
  lastFeedT=t;
}
function buildTicks(){const s=SIM[cfg],box=$("#ticks");box.innerHTML="";
  const mk=(tt,c,x)=>{const d=document.createElement("div");d.className="tick "+c;d.style.left=(tt/MAXT*100)+"%";d.textContent=x;box.appendChild(d);};
  mk(0,"atk","攻击");if(s.t_detect!=null)mk(s.t_detect,"detect","检测");if(s.recovery!=null)mk(s.recovery,"rec","隔离");[15,30,45,60].forEach(v=>mk(v,"",v));}
function verdict(){const m=SIM[cfg].metrics;$("#verdict").innerHTML=`残余受控电量 <b>${m.dE_kwh} kWh</b> · 被拒会话 <b>${m.denied}</b> · 峰值受控 <b>${m.ctrl_mw} MW</b> · 受控 <b>${m.ctrl_sites}</b> 站`+(m.tau_d!=null?` · 检测 <b>${m.tau_d}min</b>`:"")+(m.recovery!=null?` · 恢复 <b>${m.recovery}min</b>`:" · 未遏制");}
function setCfg(c){cfg=c;document.querySelectorAll("#seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===c));
  buildTicks();verdict();draw();tele("#t1","cmdrate",5,false);tele("#t2","ratio",0.5,true);render(+$("#scrub").value);}
CFGS.forEach(c=>{const b=document.createElement("button");b.textContent=c;b.dataset.c=c;b.onclick=()=>setCfg(c);$("#seg").appendChild(b);});
$("#foot").textContent=`真实 OCPP 1.6 仿真 · 代表日 ${DATA.meta.day} 16–22 时 · ${DATA.meta.n_sites} 站 · EPSG:25831 · 报文/指标/地图均由仿真逐站事件驱动`;
let playing=false,raf=null,last=0;const scrub=$("#scrub");
function step(ts){if(!playing)return;const dt=(ts-last)/1000;last=ts;const sp=+$("#speed").value;let t=+scrub.value+dt*sp;
  if(t>=MAXT){t=MAXT;playing=false;$("#play").textContent="▶ 重播";}scrub.value=t;render(t);if(playing)raf=requestAnimationFrame(step);}
$("#play").onclick=()=>{if(+scrub.value>=MAXT)scrub.value=0;playing=!playing;$("#play").textContent=playing?"⏸ 暂停":"▶ 播放";if(playing){last=performance.now();raf=requestAnimationFrame(step);}};
scrub.oninput=()=>{playing=false;$("#play").textContent="▶ 播放";render(+scrub.value);};
addEventListener("resize",()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>{layout();tele("#t1","cmdrate",5,false);tele("#t2","ratio",0.5,true);},160);});
